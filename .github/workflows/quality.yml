name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release gate
        run: node scripts/release-check.mjs

      - name: Run deterministic interview regression stress
        run: node ambassador/interview-stress.mjs 100000

      - name: Run retrieval stress regression
        run: node ambassador/stress.mjs

      - name: Scan tracked text for exposed credentials
        shell: bash
        run: |
          if git grep -n -I -E 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----' -- ':!ambassador/INTERVIEW_SIMULATION_RESULTS.json' ':!ambassador/STRESS_RESULTS.json'; then
            echo 'Potential credential material detected in tracked files.'
            exit 1
          fi

      - name: Upload deterministic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            ambassador/INTERVIEW_SIMULATION_RESULTS.json
            ambassador/STRESS_RESULTS.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
